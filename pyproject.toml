[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blastline"
version = "0.1.0"
description = "Bitemporal supply-chain exposure analysis over real registry history"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Blastline contributors"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
